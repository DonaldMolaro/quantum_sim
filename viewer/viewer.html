<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Sim Viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2230; --muted: #667085; --line: #d6dae1;
    --accent: #2f6fed; --gate: #e8efff; --gate-ink: #1b3f9a; --ctrl: #1c2230; --meas: #fff1e0; --meas-ink: #8a4b00;
    --sphere: #c4cad6; --vec: #d6336c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1b202b; --ink: #e6e9f0; --muted: #98a2b3; --line: #2f3646;
      --accent: #6c9bff; --gate: #25335a; --gate-ink: #cfdcff; --ctrl: #e6e9f0; --meas: #4a3418; --meas-ink: #ffd9a3;
      --sphere: #44506a; --vec: #ff7ab0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, .filebtn { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  button:focus-visible, .filebtn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filebtn input { position: absolute; opacity: 0; width: 0; height: 0; }
  #cmd { font-family: ui-monospace, monospace; color: var(--accent); }
  main { padding: 16px; display: grid; gap: 16px; max-width: 1200px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .scrub { display: flex; gap: 10px; align-items: center; flex: 1 1 320px; }
  .scrub input[type=range] { flex: 1; min-width: 120px; }
  #stepLabel { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; }
  #circuitWrap { overflow-x: auto; }
  svg text { font-family: ui-monospace, monospace; }
  .gate { cursor: pointer; }
  .gate rect { fill: var(--gate); stroke: var(--gate-ink); }
  .gate text { fill: var(--gate-ink); font-size: 13px; text-anchor: middle; dominant-baseline: central; }
  .gate.meas rect { fill: var(--meas); stroke: var(--meas-ink); }
  .gate.meas text { fill: var(--meas-ink); }
  .gate.current rect { stroke-width: 3; }
  .wire { stroke: var(--line); stroke-width: 1.5; }
  .link { stroke: var(--ctrl); stroke-width: 1.5; }
  .ctrl { fill: var(--ctrl); }
  .qlabel { fill: var(--muted); font-size: 12px; dominant-baseline: central; }
  .cursor { fill: var(--accent); opacity: .12; }
  .two-col { display: grid; gap: 16px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  @media (max-width: 860px) { .two-col { grid-template-columns: 1fr; } }
  #bars { display: grid; gap: 4px; max-height: 420px; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 5.5em 1fr 4.2em; gap: 8px; align-items: center; font-family: ui-monospace, monospace; font-size: 12px; }
  .track { height: 16px; background: var(--bg); border-radius: 3px; position: relative; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
  .pct { text-align: right; color: var(--muted); }
  .legend { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .wheel { width: 90px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, hsl(0 70% 55%), hsl(60 70% 50%), hsl(120 70% 45%), hsl(180 70% 45%), hsl(240 70% 60%), hsl(300 70% 55%), hsl(360 70% 55%)); }
  #bloch { display: flex; flex-wrap: wrap; gap: 12px; }
  .bcard { text-align: center; font-size: 12px; color: var(--muted); }
  .bcard svg { cursor: grab; touch-action: none; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #msg { color: var(--vec); }
  .drop { outline: 3px dashed var(--accent); outline-offset: -8px; }
</style>
</head>
<body>
<header>
  <h1>Quantum Sim Viewer</h1>
  <label class="filebtn">Open JSON…<input id="file" type="file" accept=".json,application/json"></label>
  <button id="prev" title="Previous step (←)">◀</button>
  <button id="play" title="Play / pause (space)">▶ Play</button>
  <button id="next" title="Next step (→)">▶|</button>
  <div class="scrub"><input id="slider" type="range" min="0" max="0" value="0" aria-label="Step"><span id="stepLabel"></span></div>
  <span id="cmd"></span>
  <span id="msg" role="status"></span>
</header>
<main>
  <section>
    <h2>Circuit <span style="text-transform:none;letter-spacing:0">— click a gate to jump to it</span></h2>
    <div id="circuitWrap"></div>
  </section>
  <div class="two-col">
    <section>
      <h2>Amplitudes · bar length = probability, color = phase</h2>
      <div id="bars"></div>
      <div class="legend"><span>phase 0</span><span class="wheel"></span><span>2π</span><span id="sumP"></span></div>
    </section>
    <section>
      <h2>Bloch spheres · drag to rotate</h2>
      <div id="bloch"></div>
      <div class="note">Vector length &lt; 1 means the qubit is entangled with the rest (mixed). Qubit 0 is the least-significant bit.</div>
    </section>
  </div>
</main>
<script>
"use strict";
// Embedded Bell-state demo, replaced when the user opens an EXPORT file.
const S = Math.SQRT1_2;
const DEMO = {format:"qsim-viz",version:1,num_qubits:2,num_cbits:0,steps:[
  {op:{name:"INIT",qubits:[],params:[2,0],cbit:null,raw:"INIT 2 0"},state:{n:2,amps:[[0,1,0]],bloch:[[0,0,1],[0,0,1]],cbits:[]}},
  {op:{name:"H",qubits:[0],params:[],cbit:null,raw:"H 0"},state:{n:2,amps:[[0,S,0],[1,S,0]],bloch:[[1,0,0],[0,0,1]],cbits:[]}},
  {op:{name:"CX",qubits:[0,1],params:[],cbit:null,raw:"CX 0 1"},state:{n:2,amps:[[0,S,0],[3,S,0]],bloch:[[0,0,0],[0,0,0]],cbits:[]}}
]};

let doc = null, cur = 0, timer = null;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

function validate(d) {
  if (!d || d.format !== "qsim-viz" || !Array.isArray(d.steps) || d.steps.length === 0)
    throw new Error("Not a qsim-viz export (expected format \"qsim-viz\" with steps).");
  for (const s of d.steps)
    if (!s.op || !s.state || !Array.isArray(s.state.amps) || !Array.isArray(s.state.bloch))
      throw new Error("Malformed step in export.");
}

function load(d) {
  validate(d);
  doc = d;
  $("slider").max = d.steps.length - 1;
  stop();
  buildCircuit();
  go(d.steps.length - 1);
}

// ---------- circuit ----------
const CELL = 54, LANE = 44, LEFT = 84, TOP = 20;
const gateSteps = () => doc.steps.map((s, i) => [s, i]).filter(([s]) => s.op.name !== "INIT");

function buildCircuit() {
  const n = Math.max(...doc.steps.map(s => s.state.n)), nc = doc.num_cbits || 0;
  const gs = gateSteps();
  const width = LEFT + Math.max(gs.length, 1) * CELL + 20;
  const height = TOP + (n + (nc ? 1 : 0)) * LANE;
  const wrap = $("circuitWrap"); wrap.textContent = "";
  const svg = el("svg", {width, height, viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": "Circuit diagram"}, wrap);
  const y = q => TOP + q * LANE + LANE / 2;
  svg.cursorRect = el("rect", {class: "cursor", x: LEFT, y: TOP, width: CELL, height: n * LANE}, svg);
  for (let q = 0; q < n; q++) {
    el("line", {class: "wire", x1: LEFT - 8, x2: width - 10, y1: y(q), y2: y(q)}, svg);
    el("text", {class: "qlabel", x: 8, y: y(q)}, svg, "q" + q + (q === 0 ? " (LSB)" : ""));
  }
  if (nc) {
    const cy = TOP + n * LANE + LANE / 2;
    el("line", {class: "wire", x1: LEFT - 8, x2: width - 10, y1: cy, y2: cy, "stroke-dasharray": "4 3"}, svg);
    el("text", {class: "qlabel", x: 8, y: cy}, svg, "c");
  }
  svg.stepX = {};
  gs.forEach(([s, idx], col) => {
    const x = LEFT + col * CELL + CELL / 2;
    svg.stepX[idx] = LEFT + col * CELL;
    const op = s.op, qs = op.qubits;
    const g = el("g", {class: "gate" + (op.name === "MEASURE" ? " meas" : ""), tabindex: 0, role: "button", "aria-label": op.raw}, svg);
    g.dataset.step = idx;
    el("title", {}, g, op.raw);
    g.addEventListener("click", () => go(idx));
    g.addEventListener("keydown", e => { if (e.key === "Enter") go(idx); });
    const box = (q, label) => { el("rect", {x: x - 18, y: y(q) - 15, width: 36, height: 30, rx: 5, "stroke-width": 1.5}, g); el("text", {x, y: y(q)}, g, label); };
    const nm = op.name;
    if (op.alg) {
      // Whole-register algorithm step: one block spanning every qubit lane.
      el("rect", {x: x - 18, y: y(0) - 15, width: 36, height: (qs.length - 1) * LANE + 30, rx: 5, "stroke-width": 1.5}, g);
      el("text", {x, y: (y(0) + y(qs.length - 1)) / 2}, g, op.short || nm);
    } else if (qs.length >= 2 && nm !== "SWAP" && nm !== "ISWAP" && !["XX","YY","ZZ"].includes(nm)) {
      const lo = Math.min(...qs), hi = Math.max(...qs);
      el("line", {class: "link", x1: x, x2: x, y1: y(lo), y2: y(hi)}, g);
      const target = qs[qs.length - 1];
      for (const q of qs.slice(0, -1)) el("circle", {class: "ctrl", cx: x, cy: y(q), r: 5}, g);
      if (nm === "CX" || nm === "CNOT" || nm === "CCX" || nm === "TOFFOLI") {
        el("circle", {cx: x, cy: y(target), r: 13, fill: "var(--panel)", stroke: "var(--ctrl)", "stroke-width": 1.5}, g);
        el("line", {class: "link", x1: x - 13, x2: x + 13, y1: y(target), y2: y(target)}, g);
        el("line", {class: "link", x1: x, x2: x, y1: y(target) - 13, y2: y(target) + 13}, g);
      } else box(target, nm.replace(/^C+/, "") || nm);
    } else if (qs.length >= 2) {
      const lo = Math.min(...qs), hi = Math.max(...qs);
      el("line", {class: "link", x1: x, x2: x, y1: y(lo), y2: y(hi)}, g);
      const swapish = nm === "SWAP";
      for (const q of qs) {
        if (swapish) { el("line", {class: "link", x1: x - 8, x2: x + 8, y1: y(q) - 8, y2: y(q) + 8}, g); el("line", {class: "link", x1: x - 8, x2: x + 8, y1: y(q) + 8, y2: y(q) - 8}, g); }
        else box(q, nm);
      }
    } else if (nm === "MEASURE") {
      box(qs[0], "M");
      if (nc && op.cbit !== null && op.cbit < nc) {
        const cy = TOP + n * LANE + LANE / 2;
        el("line", {class: "link", x1: x, x2: x, y1: y(qs[0]) + 15, y2: cy, "stroke-dasharray": "3 3"}, g);
        el("circle", {class: "ctrl", cx: x, cy, r: 4}, g);
      }
    } else if (qs.length === 1) box(qs[0], nm);
  });
  wrap._svg = svg;
}

// ---------- amplitudes ----------
function phaseColor(re, im) {
  let a = Math.atan2(im, re); if (a < 0) a += 2 * Math.PI;
  return `hsl(${Math.round(a / (2 * Math.PI) * 360)} 70% 52%)`;
}
const bits = (v, n) => v.toString(2).padStart(n, "0");

function drawAmps(st) {
  const n = st.n, box = $("bars"); box.textContent = "";
  const rows = st.amps.map(([i, re, im]) => ({i, re, im, p: re * re + im * im})).sort((a, b) => b.p - a.p || a.i - b.i);
  const shown = rows.slice(0, 64);
  let sum = 0;
  for (const r of rows) sum += r.p;
  for (const r of shown) {
    const row = document.createElement("div"); row.className = "row";
    const lab = document.createElement("span"); lab.textContent = "|" + bits(r.i, n) + "⟩";
    const tr = document.createElement("div"); tr.className = "track";
    tr.title = `amplitude ${r.re.toFixed(4)} ${r.im < 0 ? "-" : "+"} ${Math.abs(r.im).toFixed(4)}i`;
    const f = document.createElement("div"); f.className = "fill";
    f.style.width = (r.p * 100).toFixed(2) + "%"; f.style.background = phaseColor(r.re, r.im);
    tr.appendChild(f);
    const pc = document.createElement("span"); pc.className = "pct"; pc.textContent = (r.p * 100).toFixed(1) + "%";
    row.append(lab, tr, pc); box.appendChild(row);
  }
  $("sumP").textContent = (rows.length > shown.length ? `top ${shown.length} of ${rows.length} · ` : "") + "Σp = " + sum.toFixed(4);
}

// ---------- bloch ----------
let yaw = -0.6, pitch = 0.35;
const R = 46;
function proj([x, y, z]) {
  // rotate about z (yaw), then tilt about x (pitch); screen x right, screen y up
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = x * cy - y * sy, y1 = x * sy + y * cy;
  return [x1 * R, -(z * cp + y1 * sp) * R, y1 * cp - z * sp];
}
function drawBlochCard(q, v) {
  const card = document.createElement("div"); card.className = "bcard";
  const svg = el("svg", {width: 130, height: 130, viewBox: "-65 -65 130 130", role: "img", "aria-label": `Bloch vector of qubit ${q}`}, card);
  const line = (a, b, attrs) => { const [x1, y1] = proj(a), [x2, y2] = proj(b); el("line", Object.assign({x1, y1, x2, y2}, attrs), svg); };
  const ring = f => { const pts = []; for (let t = 0; t <= 64; t++) { const a = t / 64 * 2 * Math.PI; const [x, y] = proj(f(a)); pts.push(x.toFixed(1) + "," + y.toFixed(1)); } el("polyline", {points: pts.join(" "), fill: "none", stroke: "var(--sphere)", "stroke-width": 1}, svg); };
  ring(a => [Math.cos(a), Math.sin(a), 0]);
  ring(a => [Math.cos(a), 0, Math.sin(a)]);
  ring(a => [0, Math.cos(a), Math.sin(a)]);
  line([0, 0, -1], [0, 0, 1], {stroke: "var(--sphere)", "stroke-dasharray": "2 3"});
  const lbl = (p, t) => { const [x, y] = proj(p.map(c => c * 1.22)); el("text", {x, y, "font-size": 9, fill: "var(--muted)", "text-anchor": "middle", "dominant-baseline": "central"}, svg, t); };
  lbl([0, 0, 1], "|0⟩"); lbl([0, 0, -1], "|1⟩"); lbl([1, 0, 0], "x"); lbl([0, 1, 0], "y");
  const r = Math.hypot(v[0], v[1], v[2]);
  if (r > 1e-6) {
    line([0, 0, 0], v, {stroke: "var(--vec)", "stroke-width": 2.5, "stroke-linecap": "round"});
    const [x, y] = proj(v); el("circle", {cx: x, cy: y, r: 3.5, fill: "var(--vec)"}, svg);
  } else el("circle", {cx: 0, cy: 0, r: 3, fill: "var(--muted)"}, svg);
  const cap = document.createElement("div"); cap.textContent = `q${q} · r=${r.toFixed(2)}`;
  card.appendChild(cap);
  return card;
}
function drawBloch(st) {
  const box = $("bloch"); box.textContent = "";
  st.bloch.forEach((v, q) => box.appendChild(drawBlochCard(q, v)));
}
let dragging = false, lx = 0, ly = 0;
$("bloch").addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; e.target.setPointerCapture?.(e.pointerId); });
window.addEventListener("pointerup", () => dragging = false);
window.addEventListener("pointermove", e => {
  if (!dragging || !doc) return;
  yaw += (e.clientX - lx) * 0.01; pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - ly) * 0.01));
  lx = e.clientX; ly = e.clientY; drawBloch(doc.steps[cur].state);
});

// ---------- navigation ----------
function go(i) {
  cur = Math.max(0, Math.min(doc.steps.length - 1, i));
  const s = doc.steps[cur];
  $("slider").value = cur;
  $("stepLabel").textContent = `step ${cur} / ${doc.steps.length - 1}`;
  $("cmd").textContent = s.op.raw;
  const svg = $("circuitWrap")._svg;
  svg.querySelectorAll(".gate").forEach(g => g.classList.toggle("current", +g.dataset.step === cur));
  const cx = svg.stepX[cur];
  svg.cursorRect.setAttribute("x", cx === undefined ? LEFT - 8 : cx);
  svg.cursorRect.setAttribute("width", cx === undefined ? 8 : CELL);
  if (cx !== undefined) { const w = $("circuitWrap"); if (cx < w.scrollLeft || cx + CELL > w.scrollLeft + w.clientWidth) w.scrollLeft = cx - w.clientWidth / 2; }
  drawAmps(s.state); drawBloch(s.state);
}
function stop() { if (timer) clearInterval(timer); timer = null; $("play").textContent = "▶ Play"; }
function play() {
  if (timer) return stop();
  if (cur >= doc.steps.length - 1) go(0);
  $("play").textContent = "❚❚ Pause";
  timer = setInterval(() => { if (cur >= doc.steps.length - 1) stop(); else go(cur + 1); }, 900);
}
$("prev").onclick = () => { stop(); go(cur - 1); };
$("next").onclick = () => { stop(); go(cur + 1); };
$("play").onclick = play;
$("slider").oninput = e => { stop(); go(+e.target.value); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type === "file") return;
  if (e.key === "ArrowLeft") { stop(); go(cur - 1); }
  else if (e.key === "ArrowRight") { stop(); go(cur + 1); }
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); play(); }
});

// ---------- loading ----------
function readFile(f) {
  const r = new FileReader();
  r.onload = () => {
    try { load(JSON.parse(r.result)); $("msg").textContent = ""; }
    catch (err) { $("msg").textContent = err.message; }
  };
  r.readAsText(f);
}
$("file").onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); };
document.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drop"); });
document.addEventListener("dragleave", () => document.body.classList.remove("drop"));
document.addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drop"); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });

load(window.QSIM_DATA || DEMO);
</script>
</body>
</html>
